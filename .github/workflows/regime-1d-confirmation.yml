name: Regime 1D Confirmation Research

on:
  pull_request:
    branches: [experiment/regime-discovery-2025-validate-2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regime-1d-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compare current gate versus 1D aligned gate
        run: python run_regime_1d_confirmation.py | tee regime-1d-confirmation.txt
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-1d-confirmation-${{ github.run_number }}
          path: |
            artifacts/regime-1d-confirmation/
            regime-1d-confirmation.txt
          if-no-files-found: error
          retention-days: 30
