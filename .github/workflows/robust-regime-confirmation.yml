name: Robust Regime Confirmation

on:
  pull_request:
    branches: [experiment/regime-4h-ema50]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robust-regime-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Confirm two robust regimes
        run: python run_robust_regime_confirmation.py | tee robust-regime-confirmation.txt
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robust-regime-confirmation-${{ github.run_number }}
          path: |
            artifacts/robust-regimes/
            robust-regime-confirmation.txt
          if-no-files-found: error
          retention-days: 30
