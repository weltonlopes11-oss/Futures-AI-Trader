name: Live Forward Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: live-forward-telegram
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run frozen forward engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET_DATA_COLLECTOR_URL: 'https://futures-ai-trader.vercel.app/api/klines'
          MARKET_DATA_COLLECTOR_KEY: ${{ secrets.MARKET_DATA_COLLECTOR_KEY }}
          FORWARD_START_UTC: '2026-09-17T00:00:00Z'
          FORWARD_END_UTC: '2026-10-17T23:59:59Z'
        run: |
          set -euo pipefail
          python -m live.forward_engine

      - name: Persist operational state
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- live/state.json live/trades.csv live/health.json)" ]; then
            echo 'No forward operational state change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live/state.json live/trades.csv live/health.json
          git commit -m 'state: persist ETH forward operational state [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
