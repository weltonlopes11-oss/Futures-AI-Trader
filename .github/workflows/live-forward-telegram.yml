name: Live Forward Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: live-forward-telegram
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run frozen forward engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORWARD_START_UTC: '2026-09-17T00:00:00Z'
          FORWARD_END_UTC: '2026-10-17T23:59:59Z'
        run: |
          set -euo pipefail
          python -m live.forward_engine

      - name: Persist paper state
        run: |
          set -euo pipefail
          if git diff --quiet -- live/state.json; then
            echo 'No state change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live/state.json
          git commit -m 'state: advance ETH forward paper monitor [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
