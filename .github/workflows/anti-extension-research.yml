name: Anti Extension Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  BACKTEST_SYMBOL: ETHUSDT
  BACKTEST_FEE_BPS_PER_SIDE: "4"
  BACKTEST_SLIPPAGE_BPS_PER_SIDE: "1"

jobs:
  ichimoku-keltner-1h:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKTEST_EVAL_START_UTC: "2026-06-01T00:00:00Z"
      BACKTEST_EVAL_END_UTC: "2026-08-01T00:00:00Z"
      BACKTEST_REQUIRE_AUGUST_CONTROL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Test causal 1h Ichimoku Keltner rules
        run: python -m pytest -q tests/test_ichimoku_keltner_1h.py
      - name: Run June-July 2026 preregistered 2ATR benchmark
        run: python run_ichimoku_keltner_1h_stop_backtest.py | tee ichimoku-keltner-1h-stop.txt
      - name: Preserve June-July 2ATR benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ichimoku-keltner-1h-june-july-${{ github.run_number }}
          path: |
            artifacts/ichimoku-keltner-1h-stop/
            ichimoku-keltner-1h-stop.txt
          if-no-files-found: error
          retention-days: 30
