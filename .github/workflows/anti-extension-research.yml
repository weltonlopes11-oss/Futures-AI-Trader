name: Anti Extension Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  BACKTEST_SYMBOL: ETHUSDT
  BACKTEST_START_UTC: "2026-09-01T00:00:00Z"
  BACKTEST_END_UTC: "2026-09-15T00:00:00Z"
  BACKTEST_FEE_BPS_PER_SIDE: "4"
  BACKTEST_SLIPPAGE_BPS_PER_SIDE: "1"

jobs:
  anti-extension-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Test anti-extension logic
        run: python -m pytest -q tests/test_anti_extension.py
      - name: Run anti-extension benchmark
        shell: bash
        run: |
          set -euo pipefail
          python run_anti_extension_benchmark.py | tee anti-extension-benchmark.txt
      - name: Preserve anti-extension benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-extension-benchmark-${{ github.run_number }}
          path: |
            artifacts/anti-extension-benchmark/
            anti-extension-benchmark.txt
          if-no-files-found: error
          retention-days: 30

  macro-regime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKTEST_EVAL_START_UTC: "2026-06-17T00:00:00Z"
      BACKTEST_EVAL_END_UTC: "2026-09-15T00:00:00Z"
      BACKTEST_STRATEGY_WARMUP_DAYS: "14"
      BACKTEST_MACRO_WARMUP_DAYS: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily-only regime validation
        shell: bash
        run: |
          set -euo pipefail
          python run_macro_regime_validation_fast.py | tee macro-regime-validation.txt
      - name: Preserve daily regime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-regime-validation-${{ github.run_number }}
          path: |
            artifacts/macro-regime-validation/
            macro-regime-validation.txt
          if-no-files-found: error
          retention-days: 30
