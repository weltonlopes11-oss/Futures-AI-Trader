name: 4H Regime + ER20 Research

on:
  pull_request:
    branches: [experiment/regime-4h-ema50]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  BACKTEST_SYMBOL: ETHUSDT
  BACKTEST_EVAL_START_UTC: "2026-01-01T00:00:00Z"
  BACKTEST_EVAL_END_UTC: "2026-09-01T00:00:00Z"
  BACKTEST_FEE_BPS_PER_SIDE: "4"
  BACKTEST_SLIPPAGE_BPS_PER_SIDE: "1"

jobs:
  regime-4h-er20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Jan-Aug 4H regime + ER20 benchmark
        shell: bash
        run: |
          set -euo pipefail
          python run_regime_4h_er20_backtest.py | tee regime-4h-er20.txt
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-4h-er20-${{ github.run_number }}
          path: |
            artifacts/regime-4h-er20/
            regime-4h-er20.txt
          if-no-files-found: error
          retention-days: 30
