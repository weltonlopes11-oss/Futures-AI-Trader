name: MACD RSI Exit Research

on:
  pull_request:
    branches: [experiment/macd-entry-filter]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  BACKTEST_SYMBOL: ETHUSDT
  BACKTEST_EVAL_START_UTC: "2026-01-01T00:00:00Z"
  BACKTEST_EVAL_END_UTC: "2026-09-01T00:00:00Z"
  BACKTEST_FEE_BPS_PER_SIDE: "4"
  BACKTEST_SLIPPAGE_BPS_PER_SIDE: "1"

jobs:
  macd-rsi-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Jan-Aug MACD + RSI exit benchmark
        shell: bash
        run: |
          set -euo pipefail
          python run_macd_rsi_exit_backtest.py | tee macd-rsi-exit.txt
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macd-rsi-exit-${{ github.run_number }}
          path: |
            artifacts/macd-rsi-exit/
            macd-rsi-exit.txt
          if-no-files-found: error
          retention-days: 30
