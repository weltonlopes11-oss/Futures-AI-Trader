name: MACD Entry Filter Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  BACKTEST_SYMBOL: ETHUSDT
  BACKTEST_EVAL_START_UTC: "2026-01-01T00:00:00Z"
  BACKTEST_EVAL_END_UTC: "2026-09-01T00:00:00Z"
  BACKTEST_FEE_BPS_PER_SIDE: "4"
  BACKTEST_SLIPPAGE_BPS_PER_SIDE: "1"

jobs:
  macd-entry-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run continuous Jan-Aug MACD filter benchmark
        shell: bash
        run: |
          set -euo pipefail
          python run_macd_entry_filter_backtest.py | tee macd-entry-filter.txt
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macd-entry-filter-${{ github.run_number }}
          path: |
            artifacts/macd-entry-filter/
            macd-entry-filter.txt
          if-no-files-found: error
          retention-days: 30
