name: Robust Regime Risk Sizing

on:
  pull_request:
    branches: [experiment/regime-discovery-2025-validate-2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-sizing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run fixed fractional risk sizing
        run: python run_robust_regime_risk_sizing.py | tee robust-regime-risk-sizing.txt
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robust-regime-risk-sizing-${{ github.run_number }}
          path: |
            artifacts/risk-sizing/
            robust-regime-risk-sizing.txt
          if-no-files-found: error
          retention-days: 30
