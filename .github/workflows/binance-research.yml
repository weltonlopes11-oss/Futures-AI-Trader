name: Binance Research Window

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  BACKTEST_SYMBOL: ETHUSDT
  BACKTEST_START_UTC: "2026-09-01T00:00:00Z"
  BACKTEST_END_UTC: "2026-09-15T00:00:00Z"
  BACKTEST_FEE_BPS_PER_SIDE: "4"
  BACKTEST_SLIPPAGE_BPS_PER_SIDE: "1"

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: |
          python -m pytest -q \
            tests/test_feature_engine_causality.py \
            tests/test_open_interest_enricher.py \
            tests/test_open_interest_statistics.py \
            tests/test_oi_profit_analyzer.py \
            tests/test_binance_historical_collector.py \
            tests/test_binance_funding_rate.py \
            tests/test_operational_backtest.py

  operational-benchmark:
    needs: deterministic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run operational net-return benchmark
        shell: bash
        run: |
          set -euo pipefail
          python run_operational_benchmark.py | tee operational-benchmark.txt
      - name: Preserve trades and benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-benchmark-${{ github.run_number }}
          path: |
            artifacts/operational-benchmark/
            operational-benchmark.txt
          if-no-files-found: error
          retention-days: 30
