name: Risk 5pct Max20x Comparison

on:
  pull_request:
    branches: [experiment/continuous-equity-risk-sizing-2024-2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-sizing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sizing comparison
        shell: bash
        run: |
          set -euo pipefail
          python run_risk_5pct_max20x_comparison.py | tee risk-5pct-max20x-comparison.txt
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-5pct-max20x-comparison-${{ github.run_number }}
          path: |
            artifacts/risk-5pct-max20x-2024-2026/
            risk-5pct-max20x-comparison.txt
          if-no-files-found: error
          retention-days: 30
