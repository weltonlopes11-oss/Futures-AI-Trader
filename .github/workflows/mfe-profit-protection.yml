name: MFE Profit Protection Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  BACKTEST_SYMBOL: ETHUSDT
  BACKTEST_START_UTC: "2026-09-01T00:00:00Z"
  BACKTEST_END_UTC: "2026-09-15T00:00:00Z"
  BACKTEST_FEE_BPS_PER_SIDE: "4"
  BACKTEST_SLIPPAGE_BPS_PER_SIDE: "1"

jobs:
  mfe-profit-protection-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Test MFE profit protection logic
        run: python -m pytest -q tests/test_mfe_profit_protection.py
      - name: Run MFE profit protection benchmark
        shell: bash
        run: |
          set -euo pipefail
          python run_mfe_profit_protection_benchmark.py | tee mfe-profit-protection.txt
      - name: Preserve MFE profit protection result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfe-profit-protection-${{ github.run_number }}
          path: |
            artifacts/mfe-profit-protection/
            mfe-profit-protection.txt
          if-no-files-found: error
          retention-days: 30
