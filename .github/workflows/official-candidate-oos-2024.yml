name: Official Candidate OOS 2024

on:
  pull_request:
    branches: [experiment/regime-discovery-2025-validate-2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oos-2024:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run frozen 2024 OOS validation
        shell: bash
        run: |
          set -euo pipefail
          python run_official_candidate_oos_2024.py | tee official-candidate-oos-2024.txt
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-candidate-oos-2024-${{ github.run_number }}
          path: |
            artifacts/official-candidate-oos-2024/
            official-candidate-oos-2024.txt
          if-no-files-found: error
          retention-days: 30
